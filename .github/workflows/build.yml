name: Build & Release Installer

on:
  push:
    tags:
      - "v*"          # trigger on tags like v0.8.0, v0.9.0, etc.

permissions:
  contents: write     # needed to create GitHub Releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      # ── 1. Checkout code ────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # 3.11 has better pre-built wheel support

      # ── 3. Set up Node.js ───────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 4. Install Python dependencies ──────────────────────────────
      - name: Install Python dependencies (excluding llama-cpp-python)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --quiet

      # ── 5. Install PyInstaller ───────────────────────────────────────
      - name: Install PyInstaller
        run: pip install pyinstaller --quiet --upgrade

      # ── 6. Build React frontend ─────────────────────────────────────
      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install --prefer-offline --no-audit --no-fund
          npm run build

      # ── 7. Bundle with PyInstaller ──────────────────────────────────
      - name: PyInstaller bundle
        working-directory: .
        run: python -m PyInstaller PersonalPlanner.spec --noconfirm --clean

      # ── 8. Install Inno Setup 6 ─────────────────────────────────────
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://jrsoftware.org/download.php/is.exe' `
            -OutFile "$env:TEMP\innosetup.exe" -UseBasicParsing
          Start-Process "$env:TEMP\innosetup.exe" `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' `
            -Wait

      # ── 9. Compile Inno Setup installer ─────────────────────────────
      - name: Compile installer
        working-directory: .
        shell: cmd
        run: |
          if exist "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" (
            "%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" installer.iss
          ) else (
            "%ProgramFiles%\Inno Setup 6\ISCC.exe" installer.iss
          )

      # ── 10. Get version from tag ─────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"          # e.g. v0.8.0
          $ver = $tag.TrimStart('v')               # e.g. 0.8.0
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "ver=$ver" >> $env:GITHUB_OUTPUT

      # ── 11. Create GitHub Release & upload installer ─────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Personal Planner v${{ steps.version.outputs.ver }} BETA"
          body: |
            ## 🗓️ Personal Planner v${{ steps.version.outputs.ver }} BETA

            ### ⚡ What's New in v${{ steps.version.outputs.ver }}
            - Apple-style glassmorphism UI with animated orbs & cursor parallax
            - Revamped Relax tab — search & stream any song directly
            - New 3D app logo & branding
            - Improved performance and stability

            ### 📦 Install
            1. Download **PersonalPlannerSetup_v${{ steps.version.outputs.ver }}.exe** below
            2. Run it — Windows may show a SmartScreen warning, click **More info → Run anyway**
            3. The app installs to your user folder (no admin rights required)

            ### 🔄 Already installed?
            The app will prompt you to update automatically. Just open it and accept the update.

            ### 💻 System Requirements
            - Windows 10 or later (64-bit)
            - ~200 MB disk space
          draft: false
          prerelease: false
          files: |
            Output/PersonalPlannerSetup_v${{ steps.version.outputs.ver }}.exe
